apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediacms-redis
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediacms-redis
  template:
    metadata:
      labels:
        app: mediacms-redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          livenessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mediacms-redis
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: mediacms-redis
  ports:
    - port: 6379
