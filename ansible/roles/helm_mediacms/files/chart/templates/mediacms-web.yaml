apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediacms-web
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediacms-web
  template:
    metadata:
      labels:
        app: mediacms-web
    spec:
      containers:
        - name: web
          image: mediacms/mediacms:{{ .Values.mediacms_version }}
          ports:
            - containerPort: 80
          env:
            - name: ENABLE_CELERY_BEAT
              value: "no"
            - name: ENABLE_CELERY_SHORT
              value: "no"
            - name: ENABLE_CELERY_LONG
              value: "no"
            - name: ENABLE_MIGRATIONS
              value: "no"
            - name: FRONTEND_HOST
              value: mediacms.{{ .Values.domain }}
            - name: REDIS_LOCATION
              value: redis://mediacms-redis:6379/1
            - name: POSTGRES_HOST
              value: mediacms-db
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mediacms-secret-key
                  key: SECRET_KEY
          volumeMounts:
            - name: mediacms-media-store
              mountPath: /home/mediacms.io/mediacms/media_files/
      volumes:
        - name: mediacms-media-store
          persistentVolumeClaim:
            claimName: mediacms-media-store
---
apiVersion: v1
kind: Service
metadata:
  name: mediacms-web
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mediacms-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediacms-web
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - mediacms
  defaultBackend:
    service:
      name: mediacms-web
      port:
        number: 80
