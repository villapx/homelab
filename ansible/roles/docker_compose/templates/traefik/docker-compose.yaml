services:
  traefik:
    image: "traefik:{{ docker_compose.traefik_version }}"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    name: traefik_proxy
