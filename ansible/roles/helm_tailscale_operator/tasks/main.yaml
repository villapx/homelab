- name: Add repository
  kubernetes.core.helm_repository:
    repo_name: tailscale
    repo_url: https://pkgs.tailscale.com/helmcharts

- name: Install
  kubernetes.core.helm:
    chart_ref: tailscale/tailscale-operator
    chart_version: 1.96.5
    release_name: tailscale-operator
    release_namespace: tailscale
    create_namespace: true
    update_repo_cache: true
    release_values: "{{ lookup('ansible.builtin.template', 'templates/values.yaml') | from_yaml }}"
